<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIUM x CHEATS | Official Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --c0: #020604;
            --c1: #061209;
            --neon-primary: #00ff66;
            --neon-primary-dim: rgba(0, 255, 102, 0.2);
            --neon-secondary: #ffffff;
            --neon-dark: #008f39;
            --white: #ffffff;
            --muted: #8b9ca5;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--c0);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* VIDEO BG & OVERLAYS */

        .vbg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .vbg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.25;
            mix-blend-mode: screen;
            filter: hue-rotate(90deg) saturate(1.5);
        }

        .vbg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 70% 70% at 50% 0%, rgba(0, 255, 102, 0.15) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 10% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 60%), linear-gradient(180deg, rgba(2, 6, 4, 0.5) 0%, rgba(2, 6, 4, 0.95) 70%, var(--c0) 100%);
        }

        .noise {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* LAYOUT */

        .wrap {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAV */

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 3rem;
            border-bottom: 1px solid rgba(0, 255, 102, 0.1);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(2, 6, 4, 0.7);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--white);
            background: linear-gradient(90deg, var(--neon-secondary), var(--neon-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid var(--neon-primary);
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--neon-primary);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--neon-primary);
            box-shadow: 0 0 10px var(--neon-primary);
            animation: pd 1.5s ease-in-out infinite;
        }

        @keyframes pd {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(1)
            }
            50% {
                opacity: 1;
                transform: scale(1.5)
            }
        }

        /* HERO */

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6rem 2rem 4rem;
        }

        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--neon-primary);
            margin-bottom: 2rem;
            padding: 8px 20px;
            border: 1px solid var(--neon-primary-dim);
            border-radius: 100px;
            background: rgba(0, 255, 102, 0.05);
            box-shadow: 0 0 20px var(--neon-primary-dim);
        }

        .hero-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(3.5rem, 8vw, 7.5rem);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .hero-title .line1 {
            display: block;
            color: var(--white);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .hero-title .line2 {
            display: block;
            background: linear-gradient(135deg, var(--neon-secondary) 0%, #a8ffcc 50%, var(--neon-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(0, 255, 102, 0.4));
        }

        .hero-sub {
            max-width: 550px;
            color: var(--muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 3.5rem;
        }

        /* BUTTONS */

        .cta-group {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--neon-primary);
            color: var(--neon-primary);
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(.22, 1, .36, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        .btn-primary:hover {
            background: var(--neon-primary);
            color: #000;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 30px var(--neon-primary);
        }

        .btn-primary .arrow {
            transition: transform 0.3s;
        }

        .btn-primary:hover .arrow {
            transform: translateX(6px);
        }

        .btn-ghost {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--white);
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-decoration: none;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .btn-ghost:hover {
            border-color: var(--neon-secondary);
            color: var(--neon-secondary);
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* STATS */

        .stats-bar {
            display: flex;
            justify-content: center;
            margin: 5rem auto 0;
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(0, 255, 102, 0.1);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            background: rgba(6, 18, 9, 0.5);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .stat-item {
            flex: 1;
            padding: 2rem 1rem;
            text-align: center;
            border-right: 1px solid rgba(0, 255, 102, 0.1);
            position: relative;
            transition: background 0.3s;
        }

        .stat-item:last-child {
            border-right: none;
        }

        .stat-item:hover {
            background: rgba(0, 255, 102, 0.05);
        }

        .stat-val {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--white);
            display: block;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .stat-item:nth-child(2) .stat-val {
            color: var(--neon-primary);
            text-shadow: 0 0 15px var(--neon-primary);
        }

        .stat-item:nth-child(3) .stat-val {
            color: var(--neon-dark);
            text-shadow: 0 0 15px var(--neon-dark);
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* FEATURES */

        .features {
            padding: 8rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .section-label {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--neon-primary);
            margin-bottom: 1rem;
        }

        .section-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            text-align: center;
            margin-bottom: 4rem;
            color: var(--white);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background: rgba(0, 255, 102, 0.1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        .feat-card {
            background: var(--c1);
            padding: 3.5rem 2.5rem;
            transition: all 0.4s cubic-bezier(.22, 1, .36, 1);
            position: relative;
            overflow: hidden;
        }

        .feat-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0, 255, 102, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .feat-card:hover {
            background: #081a0d;
            transform: translateY(-5px);
            z-index: 2;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .feat-card:hover::before {
            opacity: 1;
        }

        .feat-icon {
            width: 56px;
            height: 56px;
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid var(--neon-primary-dim);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 2rem;
            transition: all 0.4s;
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.05);
        }

        .feat-card:hover .feat-icon {
            background: rgba(0, 255, 102, 0.1);
            border-color: var(--neon-primary);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3), inset 0 0 15px rgba(0, 255, 102, 0.2);
            transform: scale(1.1);
        }

        .feat-name {
            font-family: 'Syne', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--white);
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
        }

        .feat-desc {
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.7;
        }

        /* FOOTER */

        footer {
            border-top: 1px solid rgba(0, 255, 102, 0.1);
            padding: 2.5rem 3rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.5rem;
            backdrop-filter: blur(20px);
            background: rgba(2, 6, 4, 0.8);
        }

        .footer-brand {
            font-family: 'Syne', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .footer-brand span {
            color: var(--neon-primary);
            font-weight: 800;
        }

        .footer-links {
            display: flex;
            gap: 2rem;
        }

        .footer-links a {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: all 0.3s;
        }

        .footer-links a:hover {
            color: var(--neon-primary);
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: 1fr;
            }
            .stats-bar {
                flex-direction: column;
            }
            .stat-item {
                border-right: none;
                border-bottom: 1px solid rgba(0, 255, 102, 0.1);
            }
        }

        @media (max-width: 600px) {
            nav {
                padding: 1rem;
            }
            footer {
                flex-direction: column;
                text-align: center;
            }
            .hero-title {
                font-size: 3rem;
            }
        }
    </style>
</head>

        <script>
            window.addEventListener('DOMContentLoaded', (event) => {
            var video = document.getElementById('bg-video');
            if (video) {

            // ইনস্পেক্ট ও রাইট ক্লিক প্রোটেকশন
